name: CI/CD Frontend

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Obtener codigo del repositorio
      uses: actions/checkout@v3

    - name: Iniciar sesion en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir y subir imagen del Frontend
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest

    - name: Configurar credenciales de AWS Academy
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Desplegar Frontend en EC2 via AWS SSM
      run: |
        aws ssm send-command \
          --instance-ids "${{ secrets.AWS_INSTANCE_ID_FRONT }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Desplegando contenedor Frontend" \
          --parameters 'commands=[
            "mkdir -p ~/app",
            "cd ~/app",
            "cat << \EOF > docker-compose.yml
        version: \"3.8\"
        services:
          frontend:
            image: '${{ secrets.DOCKERHUB_USERNAME }}'/innovatech-frontend:latest
            container_name: front_innovatech
            restart: always
            environment:
              FLASK_ENV: production
              BACKEND_URL: \"http://'${{ secrets.BACKEND_PRIVATE_IP }}':3000\"
              SECRET_KEY: \"'${{ secrets.FLASK_SECRET_KEY }}'\"
            ports:
              - \"80:5000\"
        EOF",
            "sudo docker compose pull",
            "sudo docker compose up -d"
          ]'